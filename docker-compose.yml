version: '3.8'

services:
  userauth:
    build: ./server/UserAuth-Service
    ports:
      - "7002:7002"
    env_file:
      - ./server/UserAuth-Service/.env
    environment:
      MONGOOSE_URI: mongodb://db/store
      PORT: 7002
    networks:
      ayurmart-network:
  
  cart:
    build: ./server/Shopping-cart
    ports:
      - "7001:7001"
    env_file:
      - ./server/Shopping-cart/.env
    environment:
      MONGOOSE_URI: mongodb://db/store
      PORT: 7001
    networks:
      ayurmart-network:
  
  product:
    build: ./server/Product-Service
    ports:
      - "7005:7005"
    env_file:
      - ./server/Product-Service/.env
    environment:
      MONGOOSE_URI: mongodb://db/store
      PORT: 7005
    networks:
      ayurmart-network:

  order:
    build: ./server/Order-Service
    ports:
      - "7006:7006"
    env_file:
      - ./server/Order-Service/.env
    environment:
      MONGOOSE_URI: mongodb://db/store
      PORT: 7006
    networks:
      ayurmart-network:
  
  coupon:
    build: ./server/Coupon-Service
    ports:
      - "7003:7003"
    env_file:
      - ./server/Coupon-Service/.env
    environment:
      MONGOOSE_URI: mongodb://db/store
      PORT: 7003
    networks:
      ayurmart-network:
  
   
  seller:
    build: ./server/Seller-Service
    ports:
      - "7004:7004"
    env_file:
      - ./server/Seller-Service/.env
    environment:
      MONGOOSE_URI: mongodb://db/store
      PORT: 7004
    networks:
      ayurmart-network:
  
  web:
    build: ./client
    ports:
      - "3000:3000"
    networks:
      ayurmart-network:
  db:
    image: mongo:4.0-xenial
    ports:
      - "27017:27017"
    volumes:
      - AYURMART-Microservice:/data/db
    networks:
      ayurmart-network:

networks:
  ayurmart-network:

volumes:
  AYURMART-Microservice: