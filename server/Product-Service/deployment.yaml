apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      containers:
        - name: product
          image: hiranyap/ayurmart-microservice-product:latest
          ports:
            - containerPort: 7005
          env:
              - name: PORT
                value: "7005"
          envFrom:
            - secretRef:
                name: ayurmart-secrets
---

apiVersion: v1
kind: Service
metadata:
  name: product-service
spec:
  selector:
    app: product
  ports:
    - name: http
      protocol: TCP
      port: 7005
      targetPort: 7005
  type: NodePort