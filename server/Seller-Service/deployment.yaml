apiVersion: apps/v1
kind: Deployment
metadata:
  name: seller-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seller
  template:
    metadata:
      labels:
        app: seller
    spec:
      containers:
        - name: seller
          image: hiranyap/ayurmart-microservice-seller:latest
          ports:
            - containerPort: 7004
          env:
              - name: PORT
                value: "7004"
          envFrom:
            - secretRef:
                name: ayurmart-secrets
---

apiVersion: v1
kind: Service
metadata:
  name: seller-service
spec:
  selector:
    app: seller
  ports:
    - name: http
      protocol: TCP
      port: 7004
      targetPort: 7004
  type: NodePort